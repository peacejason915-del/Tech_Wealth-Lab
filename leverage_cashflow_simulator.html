  <script type="text/babel">
    const { useState, useMemo, useRef, useEffect } = React;

    // 自建高品質輕量 SVG 圖標元件以確保無外部字型相依
    const Icons = {
      DollarSign: ({ className = "w-4 h-4" }) => (
        <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />

      ),
      Shield: ({ className = "w-4 h-4" }) => (
        <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">

      ),
      CheckCircle: ({ className = "w-4 h-4" }) => (

    // 高性能純 SVG 響應式走勢圖（具備交叉線與數值提示框）
    function InteractiveChart({ data }) {
      const [hoverIndex, setHoverIndex] = useState(null);
      const svgRef = useRef(null);

      if (!data || data.length === 0) return null;

      const keys = [
        { key: '信貸投資淨資產', color: '#34d399', dash: '0', label: '信貸淨資產' },
        { key: '質押投資淨資產', color: '#c084fc', dash: '0', label: '質押淨資產' },
        { key: '信貸累積總成本', color: '#38bdf8', dash: '4 4', label: '信貸累計成本' },
        { key: '質押累積總成本', color: '#fb7185', dash: '4 4', label: '質押累計成本' },
      ];

      // 計算數值極值以自動縮放 Y 軸
      let allValues = [];
      data.forEach(item => {
        keys.forEach(k => allValues.push(item[k.key] || 0));
      });
      const minVal = Math.min(0, ...allValues);
      const maxVal = Math.max(...allValues, 100000);
      const range = maxVal - minVal || 1;

      const padding = { top: 20, right: 30, bottom: 40, left: 60 };
      const width = 680;
      const height = 300;
      const chartWidth = width - padding.left - padding.right;
      const chartHeight = height - padding.top - padding.bottom;

      const getX = (index) => padding.left + (index / (data.length - 1 || 1)) * chartWidth;
      const getY = (val) => padding.top + chartHeight - ((val - minVal) / range) * chartHeight;

      // 生成 SVG Polyline 路徑點
      const generatePoints = (keyName) => {
        return data.map((d, i) => `${getX(i)},${getY(d[keyName])}`).join(' ');
      };

      const handleMouseMove = (e) => {
        if (!svgRef.current) return;
        const rect = svgRef.current.getBoundingClientRect();
        const clientX = e.clientX - rect.left;
        const ratio = (clientX - padding.left) / chartWidth;
        const index = Math.round(ratio * (data.length - 1));
        if (index >= 0 && index < data.length) {
          setHoverIndex(index);
        }
      };

      const activePoint = hoverIndex !== null ? data[hoverIndex] : data[data.length - 1];

      return (
        <div className="w-full relative select-none">
          <svg
            ref={svgRef}
            viewBox={`0 0 ${width} ${height}`}
            className="w-full h-auto overflow-visible cursor-crosshair"
            onMouseMove={handleMouseMove}
            onMouseLeave={() => setHoverIndex(null)}
          >
            {/* 橫向背景格線 */}
            {[0, 0.25, 0.5, 0.75, 1].map((ratio, i) => {
              const y = padding.top + chartHeight * (1 - ratio);
              const val = minVal + range * ratio;
              return (
                <g key={i}>
                  <line
                    x1={padding.left}
                    y1={y}
                    x2={width - padding.right}
                    y2={y}
                    stroke="#1e293b"
                    strokeDasharray="3 3"
                    strokeWidth="1"
                  />
                  <text
                    x={padding.left - 8}
                    y={y + 4}
                    fill="#64748b"
                    fontSize="10"
                    textAnchor="end"
                    className="font-mono"
                  >
                    ${(val / 10000).toFixed(0)}萬
                  </text>
                </g>
              );
            })}

            {/* X 軸標籤 */}
            {data.map((d, i) => {
              const x = getX(i);
              return (
                <text
                  key={i}
                  x={x}
                  y={height - padding.bottom + 20}
                  fill="#94a3b8"
                  fontSize="11"
                  textAnchor="middle"
                  className="font-mono"
                >
                  {d.name}
                </text>
              );
            })}

            {/* 各數據折線 */}
            {keys.map((k) => (
              <polyline
                key={k.key}
                fill="none"
                stroke={k.color}
                strokeWidth="2.5"
                strokeDasharray={k.dash}
                points={generatePoints(k.key)}
                className="transition-all duration-300"
              />
            ))}

            {/* 懸浮游標輔助線 */}
            {hoverIndex !== null && (
              <line
                x1={getX(hoverIndex)}
                y1={padding.top}
                x2={getX(hoverIndex)}
                y2={height - padding.bottom}
                stroke="#64748b"
                strokeDasharray="2 2"
                strokeWidth="1.5"
              />
            )}

            {/* 節點圓點 */}
            {keys.map((k) => {
              const idx = hoverIndex !== null ? hoverIndex : data.length - 1;
              const x = getX(idx);
              const y = getY(data[idx][k.key]);
              return (
                <circle
                  key={k.key}
                  cx={x}
                  cy={y}
                  r="5"
                  fill={k.color}
                  stroke="#0b0f19"
                  strokeWidth="2"
                  className="transition-all duration-150"
                />
              );
            })}
          </svg>

          {/* 懸浮提示浮動面板 */}
          <div className="mt-3 p-3 bg-slate-900/90 backdrop-blur rounded-xl border border-slate-700/80 flex flex-wrap items-center justify-between gap-3 text-xs">
            <div className="flex items-center gap-2">
              <span className="font-bold text-amber-400 font-mono bg-amber-950/60 px-2 py-0.5 rounded border border-amber-800/40">
                {activePoint.name} 數據即時鏡像
              </span>
              <span className="text-slate-500 text-[11px] hidden sm:inline">(滑鼠在圖表滑動可切換年份)</span>
            </div>
            <div className="flex flex-wrap items-center gap-4 font-mono">
              <div className="flex items-center gap-1.5">
                <span className="w-2.5 h-2.5 rounded-full bg-emerald-400"></span>
                <span className="text-slate-400">信貸淨值:</span>
                <span className="text-emerald-300 font-bold">{(activePoint['信貸投資淨資產'] / 10000).toFixed(1)} 萬</span>
              </div>
              <div className="flex items-center gap-1.5">
                <span className="w-2.5 h-2.5 rounded-full bg-purple-400"></span>
                <span className="text-slate-400">質押淨值:</span>
                <span className="text-purple-300 font-bold">{(activePoint['質押投資淨資產'] / 10000).toFixed(1)} 萬</span>
              </div>
              <div className="flex items-center gap-1.5">
                <span className="w-2 h-0.5 bg-sky-400"></span>
                <span className="text-slate-400">信貸成本:</span>
                <span className="text-sky-300 font-semibold">{(activePoint['信貸累積總成本'] / 10000).toFixed(1)} 萬</span>
              </div>
              <div className="flex items-center gap-1.5">
                <span className="w-2 h-0.5 bg-rose-400"></span>
                <span className="text-slate-400">質押成本:</span>
                <span className="text-rose-300 font-semibold">{(activePoint['質押累積總成本'] / 10000).toFixed(1)} 萬</span>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function DebtSimulator() {
      // --- 📥 使用者輸入狀態設定（以「萬」為主要輸入單位） ---
      const [principalWan, setPrincipalWan] = useState(100); // 借款總額（萬）
      const [expectedReturn, setExpectedReturn] = useState(7); // 預期投資年報酬率 %

      // 信貸參數
      const [loanRate, setLoanRate] = useState(2.3); // 信貸年利率 %
      const [loanYears, setLoanYears] = useState(7); // 信貸年限
      const [loanFee, setLoanFee] = useState(3000); // 信貸開辦費 (元)
      const [reserveMonths, setReserveMonths] = useState(12); // 預留本息月數
      const [enableLoanRollover, setEnableLoanRollover] = useState(false); // 循環轉貸/借新還舊開關

      // 質押參數與開關
      const [enablePledge, setEnablePledge] = useState(true); // 是否啟用質押
      const [pledgeRatio, setPledgeRatio] = useState(20); // 質押成數 (預設 20% 安全平衡)
      const [pledgeRate, setPledgeRate] = useState(2.8); // 質押年利率 %
      const [secondPoolWan, setSecondPoolWan] = useState(30); // 第二資金池額度（萬）

      // 視圖切換
      const [showTable, setShowTable] = useState(false);

      // 萬轉元輔助換算
      const principal = principalWan * 10000;
      const secondPool = secondPoolWan * 10000;

      // 快捷情境套用
      const applyPreset = (type) => {
        if (type === 'conservative') {
          setPrincipalWan(100);
          setExpectedReturn(6);
          setLoanRate(2.2);
          setReserveMonths(18);
          setEnablePledge(false); // 保守防禦：純信貸，不碰質押
          setPledgeRatio(0);
          setPledgeRate(2.6);
          setSecondPoolWan(50);
        } else if (type === 'balanced') {
          setPrincipalWan(150);
          setExpectedReturn(7.5);
          setLoanRate(2.3);
          setReserveMonths(12);
          setEnablePledge(true);
          setPledgeRatio(20); // 標準實戰：質押調至極度安全平衡 20%
          setPledgeRate(2.8);
          setSecondPoolWan(30);
        } else if (type === 'aggressive') {
          setPrincipalWan(250);
          setExpectedReturn(9.5);
          setLoanRate(2.5);
          setReserveMonths(3);
          setEnablePledge(true);
          setPledgeRatio(60); // 極限運轉：質押開滿 60%
          setPledgeRate(3.1);
          setSecondPoolWan(10);
        }
      };

      // --- 🧮 核心財務計算邏輯 ---
      const financeData = useMemo(() => {
        // 1. 信貸每月本息攤還金額 (PMT 公式)
        const monthlyRate = (loanRate / 100) / 12;
        const totalMonths = Math.max(1, loanYears * 12);
        const loanPMT = monthlyRate === 0 
          ? principal / totalMonths 
          : (principal * monthlyRate * Math.pow(1 + monthlyRate, totalMonths)) / (Math.pow(1 + monthlyRate, totalMonths) - 1);

        // 2. 預留本息與實質操作資金
        const totalReserveCash = Math.min(loanPMT * reserveMonths, principal);
        const actualInvestedCash = Math.max(0, principal - totalReserveCash);

        // 3. 生存天數測試 (Runway)：預留現金 + 第二資金池，可以撐幾個月不加薪、不賣股？
        const totalSafetyBuffer = totalReserveCash + secondPool;
        const runwayMonths = loanPMT > 0 ? totalSafetyBuffer / loanPMT : 999;

        // 4. 質押成數與安全維持率計算
        // 質押實際借出金額 = 本金 * (成數 / 100)
        const pledgeLoanAmount = enablePledge ? principal * (pledgeRatio / 100) : 0;
        // 股票總擔保現值以本金計算，維持率 = (擔保股票市值 / 借款金額) * 100%
        const pledgeMaintenanceRate = pledgeLoanAmount > 0 ? (principal / pledgeLoanAmount) * 100 : 9999;
        // 追繳門檻為 130%：耐跌幅度 = 1 - (1.30 * 質押成數 / 100)
        const maxDrawdownTolerance = pledgeLoanAmount > 0 ? Math.max(0, (1 - (1.30 * (pledgeRatio / 100))) * 100) : 100;

        // 5. 計算逐年累積軌跡 (用於圖表呈現)
        const chartData = [];
        const annualBreakdown = [];
        let loanRemainingPrincipal = principal;
        let loanCumulativeInterest = 0;
        let loanTotalFees = loanFee;
        
        // 投資複利軌跡 (按月複利)
        let loanInvestValue = actualInvestedCash; 
        
        // 【修正核心】：若未啟用質押或成數為0，質押投資部位與負債皆為 0
        const isPledgeActive = enablePledge && pledgeLoanAmount > 0;
        let pledgeInvestValue = isPledgeActive ? pledgeLoanAmount : 0;
        const monthlyReturnRate = (expectedReturn / 100) / 12;

        for (let year = 1; year <= loanYears; year++) {
          let yearInterest = 0;
          let yearPrincipalPaid = 0;

          // 模擬這一年（12個月）的變化
          for (let m = 1; m <= 12; m++) {
            const interestThisMonth = loanRemainingPrincipal * monthlyRate;
            const principalThisMonth = Math.min(loanRemainingPrincipal, loanPMT - interestThisMonth);
            loanRemainingPrincipal = Math.max(0, loanRemainingPrincipal - principalThisMonth);
            loanCumulativeInterest += interestThisMonth;
            yearInterest += interestThisMonth;
            yearPrincipalPaid += principalThisMonth;

            loanInvestValue = loanInvestValue * (1 + monthlyReturnRate);
            if (isPledgeActive) {
              pledgeInvestValue = pledgeInvestValue * (1 + monthlyReturnRate);
            }
          }

          // 若開啟「循環轉貸 / 借新還舊 (Rollover)」：每滿 3 年或期末時，將已還本金再度借出全數投入市場，並支付轉貸手續費
          if (enableLoanRollover && year % 3 === 0 && year < loanYears) {
            const repaidPrincipal = principal - loanRemainingPrincipal;
            if (repaidPrincipal > 0) {
              loanInvestValue += repaidPrincipal; // 本金重借投入
              loanRemainingPrincipal = principal; // 重置負債
              loanTotalFees += loanFee; // 轉貸開辦手續費
            }
          }

          // 質押同期的利息累積 (只繳息不還本)
          const pledgeCumulativeCost = isPledgeActive ? (pledgeLoanAmount * (pledgeRate / 100)) * year : 0;
          const pledgeNetAsset = isPledgeActive ? Math.round(pledgeInvestValue - pledgeLoanAmount) : 0;

          const snapshot = {
            year,
            name: `第 ${year} 年`,
            '信貸累積總成本': Math.round(loanCumulativeInterest + loanTotalFees),
            '信貸投資淨資產': Math.round(loanInvestValue - loanRemainingPrincipal),
            '質押累積總成本': Math.round(pledgeCumulativeCost),
            '質押投資淨資產': pledgeNetAsset,
            loanRemainingPrincipal: Math.round(loanRemainingPrincipal),
            loanInvestValue: Math.round(loanInvestValue),
            pledgeInvestValue: Math.round(pledgeInvestValue)
          };

          chartData.push(snapshot);
          annualBreakdown.push(snapshot);
        }

        // 6. 終局數據摘要
        const finalLoanCost = loanCumulativeInterest + loanTotalFees;
        const finalLoanNetProfit = loanInvestValue - finalLoanCost - actualInvestedCash;
        const finalPledgeCost = isPledgeActive ? (pledgeLoanAmount * (pledgeRate / 100)) * loanYears : 0;
        const finalPledgeNetProfit = isPledgeActive ? (pledgeInvestValue - pledgeLoanAmount) - finalPledgeCost : 0;

        return {
          loanPMT,
          totalReserveCash,
          actualInvestedCash,
          runwayMonths,
          pledgeLoanAmount,
          pledgeMaintenanceRate,
          maxDrawdownTolerance,
          chartData,
          annualBreakdown,
          finalLoanCost,
          finalLoanNetProfit,
          finalPledgeCost,
          finalPledgeNetProfit,
          isPledgeActive
        };
      }, [principal, expectedReturn, loanRate, loanYears, loanFee, reserveMonths, enableLoanRollover, enablePledge, pledgeRatio, pledgeRate, secondPool]);

      // 安全燈號判斷函式
      const getSafetyStatus = (months) => {
        if (months >= 24) {
          return {
            color: 'text-emerald-400',
            border: 'border-emerald-500/50',
            bg: 'bg-emerald-950/20',
            badge: 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30',
            text: '極度安全 (具備對抗 2 年完整熊市的韌性)',
            desc: '預留本息與備用資金充沛，能承受極端股災零收入，完全不需被迫賤賣持股。',
            icon: <Icons.CheckCircle className="w-5 h-5 text-emerald-400" />
          };
        }
        if (months >= 12) {

                    <span className="text-base sm:text-lg font-bold font-mono text-purple-300">
                      {((financeData.totalReserveCash + secondPool) / 10000).toFixed(1)} 萬
                    </span>
                    <span className="text-[10px] text-slate-500 block mt-1">預留金 + 第二池</span>
                  </div>
                </div>

                {/* 3. 走勢圖表與動態可視化 */}
                <div className="bg-slate-900/80 p-5 rounded-2xl border border-slate-800 shadow-xl">
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-4">
                    <div>
                      <h3 className="text-sm font-bold text-slate-200 flex items-center gap-2">
                        <Icons.TrendingUp className="w-4 h-4 text-emerald-400" />
                        {loanYears} 年期軌跡：「信貸去槓桿」vs「質押常態運轉」
                      </h3>
                      <p className="text-xs text-slate-400 mt-0.5">
                        實線表示淨資產積累（扣除尚餘借款本金），虛線表示累計支付成本
                      </p>
                    </div>

                    {/* 切換表格模式 */}
                    <button
                      onClick={() => setShowTable(!showTable)}
                      className="text-xs px-3 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 transition self-start sm:self-auto"
                    >
                      {showTable ? '返回走勢圖' : '查看逐年明細表'}
                    </button>
                  </div>

                  {!showTable ? (
                    <InteractiveChart data={financeData.chartData} />
                  ) : (
                    <div className="overflow-x-auto custom-scrollbar">
                      <table className="w-full text-left text-xs font-mono">
                        <thead>
                          <tr className="border-b border-slate-800 text-slate-400">
                            <th className="pb-2">年度</th>
                            <th className="pb-2 text-cyan-400">信貸尚餘本金</th>
                            <th className="pb-2 text-emerald-400">信貸投資現值</th>
                            <th className="pb-2 text-emerald-300 font-bold">信貸淨資產</th>
                            <th className="pb-2 text-purple-400">質押投資現值</th>
                            <th className="pb-2 text-purple-300 font-bold">質押淨資產</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-800/60 text-slate-300">
                          {financeData.annualBreakdown.map((row) => (
                            <tr key={row.year} className="hover:bg-slate-800/40 transition">
                              <td className="py-2.5 font-bold text-slate-400">{row.name}</td>
                              <td className="py-2.5">{(row.loanRemainingPrincipal / 10000).toFixed(1)} 萬</td>
                              <td className="py-2.5">{(row.loanInvestValue / 10000).toFixed(1)} 萬</td>
                              <td className="py-2.5 text-emerald-400 font-bold">{(row['信貸投資淨資產'] / 10000).toFixed(1)} 萬</td>
                              <td className="py-2.5">{(row.pledgeInvestValue / 10000).toFixed(1)} 萬</td>
                              <td className="py-2.5 text-purple-400 font-bold">{(row['質押投資淨資產'] / 10000).toFixed(1)} 萬</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  )}
                </div>

                {/* 4. 終局成果摘要對比卡片 */}
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  
                  {/* 信貸總結 */}
                  <div className="bg-slate-900/60 p-4 sm:p-5 rounded-2xl border border-cyan-900/40 relative overflow-hidden">
                    <div className="absolute top-0 right-0 w-24 h-24 bg-cyan-500/5 rounded-full blur-2xl pointer-events-none"></div>
                    <div className="flex items-center justify-between mb-3">
                      <h4 className="text-sm font-bold text-cyan-300 flex items-center gap-1.5">
                        🏦 信貸套利 {enableLoanRollover ? '(永續循環轉貸)' : '(逐月去槓桿)'}
                      </h4>
                      <span className="text-[10px] px-2 py-0.5 rounded bg-cyan-950/80 text-cyan-300 border border-cyan-800/60">
                        {enableLoanRollover ? '槓桿持續滿載' : '無催繳與補倉風險'}
                      </span>
                    </div>

                    <div className="space-y-2 text-xs">
                      <div className="flex justify-between text-slate-400">
                        <span>{loanYears} 年累計總成本 (利息+轉貸費)：</span>
                        <span className="font-mono text-slate-200">{(financeData.finalLoanCost / 10000).toFixed(1)} 萬</span>
                      </div>
                      <div className="flex justify-between text-slate-400">
                        <span>預估終局純獲利 (淨賺)：</span>
                        <span className="font-mono font-bold text-emerald-400 text-sm">
                          +{(financeData.finalLoanNetProfit / 10000).toFixed(1)} 萬
                        </span>
                      </div>
                      <p className="text-[11px] text-slate-400 pt-2 border-t border-slate-800 leading-relaxed">
                        {enableLoanRollover 
                          ? '優勢：每 3 年把攤還的本金重新借滿投入，享受接近質押的極限複利，但需注意未來轉貸審核與升息風險。'
                          : `優勢：債務逐月遞減，在第 ${loanYears} 年自動完全解套，不受股價波動追繳影響。`}
                      </p>
                    </div>
                  </div>

                  {/* 質押總結 */}
                  <div className={`bg-slate-900/60 p-4 sm:p-5 rounded-2xl border relative overflow-hidden ${
                    financeData.isPledgeActive ? 'border-purple-900/40' : 'border-slate-800 opacity-60'
                  }`}>
                    <div className="absolute top-0 right-0 w-24 h-24 bg-purple-500/5 rounded-full blur-2xl pointer-events-none"></div>
                    <div className="flex items-center justify-between mb-3">
                      <h4 className="text-sm font-bold text-purple-300 flex items-center gap-1.5">
                        📈 質押套利 (到期還本/全額滾動)
                      </h4>
                      <span className="text-[10px] px-2 py-0.5 rounded bg-purple-950/80 text-purple-300 border border-purple-800/60">
                        {financeData.isPledgeActive ? '需控管維持率 ≥ 160%' : '目前未動用'}
                      </span>
                    </div>

                    <div className="space-y-2 text-xs">
                      <div className="flex justify-between text-slate-400">
                        <span>{loanYears} 年累計總利息支出：</span>
                        <span className="font-mono text-slate-200">{(financeData.finalPledgeCost / 10000).toFixed(1)} 萬</span>
                      </div>
                      <div className="flex justify-between text-slate-400">
                        <span>預估終局純獲利 (淨賺)：</span>
                        <span className="font-mono font-bold text-purple-400 text-sm">
                          {financeData.isPledgeActive ? `+${(financeData.finalPledgeNetProfit / 10000).toFixed(1)} 萬` : '0 萬'}
                        </span>
                      </div>
                      <p className="text-[11px] text-slate-400 pt-2 border-t border-slate-800 leading-relaxed">
                        {financeData.isPledgeActive 
                          ? `已借出 ${(financeData.pledgeLoanAmount / 10000).toFixed(1)} 萬進場。需留心大盤急跌時維持率跌破 130% 需補錢。`
                          : '質押未開或動用成數為 0%，此策略處於防禦休眠狀態，無額外利潤亦無斷頭風險。'}
                      </p>
                    </div>
                  </div>

                </div>

              </div>

            </div>

            {/* 頁尾實戰箴言 */}
            <div className="text-center py-4 border-t border-slate-800/80 text-xs text-slate-400">
              TechWealth Lab · 槓桿套利的核心並非賺到極致，而是在市場最狂暴的深淵中永遠持有安全籌碼。
            </div>

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<DebtSimulator />);
  </script>
</body>
</html>
